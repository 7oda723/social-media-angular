<header class="bg-[#fff] py-2 px-2 sm:px-0">
    <div class="flex items-center justify-around mx-auto">

        <div class="flex items-center gap-2.5">
            <figure class="w-11">
                <img src="/img/logo-GdqARQRt.png" alt="route img" class="w-full rounded-2xl">
            </figure>
            <h1 class="hidden sm:block font-bold text-[1.3rem]">{{"Routeposts"|translate}}</h1>
        </div>

        <nav class="flex items-center border border-[#e2e8f0] bg-[#f8fafce6] sm:gap-5 py-1 px-2  rounded-3xl">

            <a href="#" class="flex items-center rounded-3xl px-3 py-2" routerLink="/feeds"
                routerLinkActive="bg-white text-blue-400">
                <span class=" pr-2">
                    <i class="fa-regular fa-house hidden text-[1.2rem] text-black/50"></i>
                </span>
                <span class="hidden sm:block text-black/60 font-medium">Feed</span>
            </a>

            <a href="" class="flex items-center rounded-3xl px-3 py-2" routerLink="/profile"
                routerLinkActive="bg-white text-blue-400">
                <span class=" pr-2">
                    <i class="fa-regular fa-user hidden text-[1.2rem] text-black/50"></i>
                </span>
                <span class="hidden sm:block text-black/60 font-medium">Profile</span>
            </a>

            <a href="" class="flex items-center rounded-3xl px-3 py-2" routerLink="/notifcation"
                routerLinkActive="bg-white text-blue-400">
                <span class=" pr-2">
                    <i class="fa-regular fa-comment text-[1.2rem] text-black/50"></i>
                </span>
                <span class="hidden sm:block text-black/60 font-medium">notifications</span>
            </a>
        </nav>

        <div (click)="isOpen() "
            class="cursor-pointer flex items-center border border-[#e2e8f0] bg-[#f8fafce6] gap-3 p-2 rounded-3xl relative">
            <figure class="w-8">
                <img src="/img/default-profile.png" alt="" class="w-full">
            </figure>
            <span class="hidden md:block text-black/60 font-medium">ahmed ahmed</span>
            <i class="fa-solid fa-bars text-black/50"></i>

            <div [hidden]="!open"
                class="absolute z-10 shadow-md bg-white rounded-2xl  left-1/2 top-14 -translate-x-1/2">
                <ul>
                    <li class="flex items-center pl-4 pt-4 pb-4 pr-25">
                        <i class="fa-regular fa-user text-[1.1rem] text-black/50 mr-2"></i>
                        <span>Profile</span>
                    </li>

                    <li class="flex items-center pl-4 pb-1 pr-25">
                        <i class="fa-solid fa-gear text-[1.1rem] text-black/50 mr-2"></i>
                        <span>Setting</span>
                    </li>

                    <li class="flex items-center pl-4 pb-1 pr-25" (click)="change('en')">
                        
                        <span>English</span>
                    </li>

                    <li class="flex items-center pl-4 pb-1 pr-25" (click)="change('ar')">
                        
                        <span>Arabic</span>
                    </li>
                    <hr class="mt-3.5 mx-2.5 opacity-15">
                    <li (click)="logoutNav()" class=" pl-4 pt-2 pb-4 pr-25">
                        <span class="text-red-600 font-medium">Logout</span>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</header>
