<section class="px-4 py-5">
    
    <div class="flex items-center gap-2 my-2">
        <h3 class="font-medium">Comments</h3>
        <span
            class="bg-blue-100 rounded-full size-5 flex items-center justify-center text-blue-500 font-medium">{{comment().length}}</span>
    </div>
    @for (item of comment(); track item._id) {
    <div class="flex items-center">
        <figure class="w-10">
            <img [src]="item.commentCreator.photo" alt="" class="w-full rounded-full">
        </figure>

        <div class="bg-[#f0f2f5] px-3 py-1.5 pl-3.5 rounded-2xl mt-2.5">
            <p class="font-medium">{{item.commentCreator.name}}</p>
            <div><span>{{item.commentCreator.username}}</span></div>
            <p>{{item.content}}</p>
        </div>


    </div>
    <div class="flex gap-2.5 text-black/45 ml-11 mt-2">
        <span>{{item.createdAt}}</span>
        <span>Like {{item.likes.length}}</span>
        <span>Replay</span>
    </div>
    }
</section>
